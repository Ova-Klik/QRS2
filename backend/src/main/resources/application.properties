spring.application.name=qr-attendance-system
server.port=8080
server.servlet.context-path=/api

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/qrs_db}
spring.data.mongodb.auto-index-creation=true

# JWT
app.jwt.secret=${JWT_SECRET:dev_secret_change_in_production_min_256_bits_long}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# CORS
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Attendance rules (Automated window: 07:00 - 10:00, Late threshold: 08:30)
app.attendance.qr-window-start=${QR_WINDOW_START:07:00}
app.attendance.qr-window-end=${QR_WINDOW_END:12:00}
app.attendance.late-threshold=${LATE_THRESHOLD:08:31}
app.attendance.timezone=Africa/Lagos

# Network restriction
app.network.school-wifi-ssid=${SCHOOL_WIFI_SSID:TechSchool-WiFi}
app.network.school-ip-range=${SCHOOL_IP_RANGE:192.168.1.0/24}
app.network.enforce=false

# Seeding
app.seed-data=${SEED_DATA:true}

# Logging
logging.level.com.techschool=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail / Brevo SMTP
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:your-brevo-smtp-username}
spring.mail.password=${BREVO_SMTP_PASSWORD:your-brevo-smtp-key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Mail & Frontend URLs
app.frontend-url=${APP_FRONTEND_URL:${FRONTEND_URL:${CLIENT_URL:http://localhost:5173}}}
app.mail.from-email=${BREVO_FROM_EMAIL:olaomovictor1@gmail.com}
app.mail.from-name=${BREVO_FROM_NAME:QRAttendance}

