version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: qrs_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-secret123}
      MONGO_INITDB_DATABASE: qrs_db
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - qrs_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: qrs_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - qrs_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrs_backend
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-secret123}@mongodb:27017/qrs_db?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-changeme_use_a_long_random_string_in_production_at_least_256_bits}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-86400000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      SCHOOL_WIFI_SSID: ${SCHOOL_WIFI_SSID:-TechSchool-WiFi}
      SCHOOL_IP_RANGE: ${SCHOOL_IP_RANGE:-192.168.1.0/24}
      QR_WINDOW_START: ${QR_WINDOW_START:-00:00}
      QR_WINDOW_END: ${QR_WINDOW_END:-23:59}
      LATE_THRESHOLD: ${LATE_THRESHOLD:-23:59}
      SEED_DATA: ${SEED_DATA:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - qrs_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: qrs_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - qrs_net

  nginx:
    image: nginx:1.25-alpine
    container_name: qrs_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - qrs_net

volumes:
  mongo_data:

networks:
  qrs_net:
    driver: bridge
